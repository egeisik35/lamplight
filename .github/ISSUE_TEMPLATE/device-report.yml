name: Device report
description: Report whether lamplight works on your laptop or device
labels: [device-report]
body:
  - type: input
    id: model
    attributes:
      label: Device model
      description: For laptops, the output of `cat /sys/class/dmi/id/product_name`
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: lamplight info
      description: "Output of `lamplight info`, or with the extension from GNOME Extensions: `python3 ~/.local/share/gnome-shell/extensions/lamplight@egeisik35.github.io/lamplight.py info`"
      render: text
    validations:
      required: true
  - type: textarea
    id: hid
    attributes:
      label: HID devices
      description: Output of `grep -H HID_NAME /sys/class/hidraw/*/device/uevent`
      render: text
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Everything works
        - Some effects work
        - Nothing changes
        - Device not found
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Distribution, desktop, kernel version (`uname -r`), and anything that looked wrong
